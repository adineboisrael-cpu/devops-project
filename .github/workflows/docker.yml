name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t israeladinebo/devops-node-app:latest .

      - name: Push Docker image
        run: docker push israeladinebo/devops-node-app:latest

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY"
          printf '%s\n' "$SSH_PRIVATE_KEY" > deploy_key
          chmod 600 deploy_key
          ssh-keygen -y -f deploy_key > /dev/null
          echo "SSH private key validated."

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            cd ~/devops-project

            echo "Pulling the latest Docker image..."
            docker pull israeladinebo/devops-node-app:latest

            echo "Starting the application..."
            docker-compose up -d

            echo "Waiting for the application to become ready..."
            for i in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:3000/health; then
                echo ""
                echo "Deployment and health check successful."
                exit 0
              fi

              echo "Application not ready yet. Retrying in 5 seconds..."
              sleep 5
            done

            echo "Health check failed after 60 seconds."
            docker-compose logs --tail=50
            exit 1
